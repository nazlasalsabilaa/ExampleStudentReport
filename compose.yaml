services:
  postgres:
    image: postgres:16-alpine
    container_name: student-report-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: student_report_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: student-report-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: student-report-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...';
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 admin admin123;
      /usr/bin/mc mb myminio/student-reports --ignore-existing;
      /usr/bin/mc anonymous set download myminio/student-reports;
      exit 0;
      "

volumes:
  postgres_data:
    name: student-report-data
  minio_data:
    name: student-report-minio-data