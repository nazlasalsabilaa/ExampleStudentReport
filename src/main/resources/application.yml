spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/student_report_db
    username: admin
    password: admin123
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 100

minio:
  url: http://localhost:9000
  public-url: http://localhost:9000
  access-key: admin
  secret-key: admin123
  bucket-name: student-reports

app:
  security:
    mock-auth: false