<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Laporan - Student Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-light" style="font-family: 'Inter', sans-serif;">

<div class="d-flex min-vh-100">
    <div th:replace="~{fragments/sidebar :: sidebar-menu(activePage='buatLaporan')}"></div>

        <div class="flex-grow-1 d-flex flex-column bg-white">

            <div th:replace="~{fragments/header :: top-navbar}"></div>

                <main class="p-4 flex-grow-1" style="background-color: #D4EBF8">
                    <div class="mb-4">
                        <h2 class="h4 fw-bold text-dark mb-1">Buat Laporan Baru</h2>
                        <p class="text-secondary small mb-0">Laporkan kerusakan fasilitas kampus</p>
                    </div>

                    <div class="bg-white p-4 shadow-sm mx-auto" style="border-radius: 12px; max-width: 800px;">
                        <form action="/report/submit" method="post" enctype="multipart/form-data">

                            <div class="mb-4">
                                <label class="form-label fw-bold text-dark d-flex align-items-center gap-2 mb-3">
                                    <i class="bi bi-image" style="font-size: 1.1rem;"></i>
                                    Foto Kerusakan<span class="text-danger">*</span>
                                </label>

                                <div class="upload-area p-5 text-center">
                                    <i class="bi bi-upload" style="font-size: 2.5rem; color: #64748B;"></i>
                                    <h5 class="h6 fw-bold mb-1">Klik untuk unggah atau seret file di sini</h5>
                                    <p class="text-muted small mb-0">PNG, JPG, dan SVG, max ukuran file 10MB</p>
                                    <input type="file" class="d-none" id="fotoKerusakan" name="fotoKerusakan" accept="image/png, image/jpeg, image/svg+xml">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="title" class="form-label fw-bold text-dark d-flex align-items-center gap-2">
                                    <i class="bi bi-pencil-square" style="font-size: 1.1rem;"></i>
                                    Judul Laporan<span class="text-danger">*</span>
                                </label>
                                <input type="text" class="form-control py-2" id="title" name="title" placeholder="Contoh: AC Mati, Proyektor Rusak" required>
                            </div>

                            <div class="mb-4">
                                <label for="kategori" class="form-label fw-bold text-dark d-flex align-items-center gap-2">
                                    <i class="bi bi-tags" style="font-size: 1.1rem;"></i>
                                    Kategori Kerusakan<span class="text-danger">*</span>
                                </label>
                                <select class="form-select py-2 text-muted" id="kategori" name="categoryId" required>
                                    <option selected disabled value="">Pilih Kategori Kerusakan</option>
                                    <option
                                            th:each="category : ${categories}"
                                            th:value="${category.id}"
                                            th:text="${category.name}">Nama Kategori</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold text-dark d-flex align-items-center gap-2">
                                    <i class="bi bi-geo-alt" style="font-size: 1.1rem;"></i>
                                    Lokasi<span class="text-danger">*</span>
                                </label>
                                <div class="row g-3 mb-3">
                                    <div class="col-12 col-md-6">
                                        <select class="form-select py-2 text-muted" name="roomId" required>
                                            <option selected disabled value="">Pilih Ruangan</option>
                                            <option
                                                th:each="room : ${rooms}"
                                                th:value="${room.id}"
                                                th:text="${room.building != null ? room.building.name + ' - ' : ''} + ${room.name} + ' (Lantai ' + ${room.floor} +')'">Nama Ruangan</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="description" class="form-label fw-bold text-dark d-flex align-items-center gap-2">
                                    <i class="bi bi-file-text" style="font-size: 1.1rem;"></i>
                                    Deskripsi Kerusakan<span class="text-danger">*</span>
                                </label>
                                <textarea class="form-control py-2" id="description" name="description" rows="4" placeholder="Jelaskan kondisi kerusakan dengan detail." required></textarea>
                            </div>

                            <div class="d-flex justify-content-end gap-3 mt-5">
                                <a href="/dashboard" class="btn btn-white border px-4 py-2 fw-semibold text-dark rounded-3">Batal</a>
                                <button type="submit" class="btn px-4 py-2 fw-bold d-flex align-items-center gap-2 rounded-3" style="background-color: #BDE0FE; color: #0F172A; border: 1px solid #A2D2FF;">
                                    <i class="bi bi-send"></i>
                                    Kirim Laporan
                                </button>
                            </div>
                        </form>
                    </div>
                </main>
        </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="/js/script.js"></script>
</body>
</html>
