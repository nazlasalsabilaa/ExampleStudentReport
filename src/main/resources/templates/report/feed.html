<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed Laporan - Student Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-light">
<div class="d-flex min-vh-100">
    <div th:replace="~{fragments/sidebar :: sidebar-menu(activePage='feed')}"></div>

    <div class="flex-grow-1 d-flex flex-column bg-white">
        <div th:replace="~{fragments/header :: top-navbar}"></div>

        <main class="p-4 flex-grow-1" style="background-color: #D4EBF8;">

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-4 shadow-sm" role="alert" style="border-radius: 10px; border-left: 5px solid #198754;">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
                <div>
                    <h2 class="h4 fw-bold text-dark mb-1">Feed Laporan Fasilitas Kampus</h2>
                    <p class="text-secondary small mb-0">Pantau semua laporan kerusakan fasilitas kampus</p>
                </div>

                <form action="/feed" method="get" id="searchFilterForm" class="d-flex align-items-center gap-2 flex-wrap">

                    <div class="position-relative" style="min-width: 240px;">
                        <input type="text" name="search" th:value="${currentSearch}" class="form-control form-control-sm ps-5 py-2 bg-white border-0 shadow-sm" style="border-radius: 8px;" placeholder="Cari laporan...">
                        <button type="submit" class="btn btn-link position-absolute top-50 start-0 translate-middle-y ms-1 p-0 border-0" style="color: #64748B; box-shadow: none;">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                    <div class="bg-white p-1 shadow-sm d-flex gap-2 align-items-center" style="border-radius: 8px;">
                        <span class="text-secondary small fw-semibold px-2 d-flex align-items-center gap-1">
                            <i class="bi bi-funnel"></i>
                            Filter
                        </span>

                        <select name="categoryId" class="form-select form-select-sm border-0 bg-light text-muted small" style="min-width: 140px;" onchange="document.getElementById('searchFilterForm').submit();">
                            <option value="">Semua Kategori</option>
                            <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}" th:selected="${category.id == currentCategory}"></option>
                        </select>

                        <select name="roomId" class="form-select form-select-sm border-0 bg-light text-muted small" style="min-width: 160px;" onchange="document.getElementById('searchFilterForm').submit();">
                            <option value="">Semua Lokasi</option>
                            <option th:each="room : ${rooms}" th:value="${room.id}" th:text="${room.building != null ? room.building.name + ' - ' : ''} + ${room.name}" th:selected="${room.id == currentRoom}"></option>
                        </select>
                    </div>
                </form>
            </div>

            <div class="row">
                <div th:if="${#lists.isEmpty(allReports)}" class="col-12 text-center text-muted py-5">
                    <i class="bi bi-circle mb-3 text-secondary animate-pulse d-inline-block" style="font-size: 3.5rem;"></i>
                    <p class="mb-0 fw-medium">Belum ada data laporan aktif yang masuk ke sistem.</p>
                </div>

                <th:block th:each="report : ${allReports}">
                    <div th:replace="~{fragments/cards/report-cards :: report-card-feed(report=${report})}"></div>
                </th:block>
            </div>

        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
