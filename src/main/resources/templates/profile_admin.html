<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Profil Administrator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #D4EBF8; font-family: 'Segoe UI', sans-serif; }
        
        .profile-card { 
            background: white; 
            border-radius: 20px; 
            padding: 45px !important; 
            width: 100%; 
            max-width: 500px; 
            margin: 50px auto; 
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.07); 
        }

        .profile-img { 
            width: 110px; height: 110px; 
            border-radius: 50%; 
            border: 4px solid #D4EBF8; 
            margin: 0 auto 25px auto; 
            display: block;
        }

        .info-row { margin-bottom: 20px; text-align: left; }
        .label-text { color: #6c757d; font-size: 0.85rem; }
        .value-text { font-weight: 700; color: #212529; }

        .btn-back {
            display: inline-block;
            background-color: #D4EBF8 !important;
            color: black !important;
            font-weight: bold;
            border-radius: 10px; 
            padding: 10px 40px; 
            margin-top: 20px; 
            text-decoration: none;
            transition: background-color 0.3s;
        }
        .btn-back:hover { background-color: #bce1f5 !important; }
    </style>
</head>
<body>

<div class="card profile-card">
    <img src="https://ui-avatars.com/api/?name=AD&background=D4EBF8&color=000&bold=true&size=200" 
         class="profile-img" alt="Foto Admin">
    
    <h4 class="fw-bold mb-4" th:text="${user.name}">Nama Admin</h4>

    <div class="px-2">
        <div class="info-row">
            <div class="label-text">Email</div>
            <div class="value-text" th:text="${user.email}"></div>
        </div>
    </div>

    <a href="/dashboard" class="btn btn-back">Kembali</a>
</div>

</body>
</html>
