<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar-menu(activePage)" class="bg-white border-end d-flex flex-column vh-100 sticky-top" style="width: 260px; min-width: 260px;">

    <div class="p-4 border-bottom d-flex align-items-center gap-2">
        <i class="bi bi-exclamation-circle" style="font-size: 1.5rem;"></i>
        <span class="fw-bold text-dark" style="font-size: 1.1rem; letter-spacing: 0.5px;">STUDENT REPORT</span>
    </div>

    <div class="d-flex flex-column px-3 py-3 gap-1 flex-grow-1">

        <a href="/dashboard" class="nav-link-custom d-flex align-items-center gap-3 py-3 px-3 rounded text-decoration-none fw-semibold"
        th:classappend="${activePage == 'dashboard'} ? 'active' : 'text-secondary'">
            <i class="bi bi-grid-1x2" style="font-size: 1.15rem;"></i>
            <span>Dashboard</span>
        </a>

        <a href="/feed" class="nav-link-custom d-flex align-items-center gap-3 py-3 px-3 rounded text-decoration-none fw-semibold"
        th:classappend="${activePage == 'feed'} ? 'active' : 'text-secondary'">
            <i class="bi bi-card-list" style="font-size: 1.15rem;"></i>
            <span>Feed Laporan</span>
        </a>

        <a th:if="${!isAdmin}" href="/buat-laporan" class="nav-link-custom d-flex align-items-center gap-3 py-3 px-3 rounded text-decoration-none fw-semibold"
        th:classappend="${activePage == 'buatLaporan'} ? 'active' : 'text-secondary'">
            <i class="bi bi-plus-circle" style="font-size: 1.15rem;"></i>
            <span>Buat Laporan</span>
        </a>
        
        <a th:if="${isAdmin}" th:href="@{/master-data}" class="nav-link-custom d-flex align-items-center gap-3 py-3 px-3 rounded text-decoration-none fw-semibold"
            th:classappend="${activePage == 'masterData'} ? 'active' : 'text-secondary'">
            <i class="bi bi-box" style="font-size: 1.15rem;"></i>
            <span>Master Data</span>
        </a>
    </div>

    <div class="p-3 border-top bg-light-subtle">
        <div class="d-flex align-items-center gap-2 mb-3 px-2">
            <div class="bg-dark rounded-circle d-flex align-items-center justify-content-center text-white fw-bold" style="width: 32px; height: 32px; font-size: 0.8rem;">
                <span th:text="${#strings.substring(#authentication.principal.name, 0, 1).toUpperCase()}">U</span>
            </div>
            <div class="overflow-hidden">
                <p class="fw-bold text-dark mb-0 style-name" style="font-size: 0.85rem;" th:text="${#authentication.principal.name}">Nama User</p>
                <p class="text-muted mb-0 style-email" style="font-size: 0.75rem;" th:text="${#authentication.principal.email}">nim@mhs.ulm.ac.id</p>
            </div>
        </div>

        <div class="d-flex flex-column gap-1" style="font-size: 0.85rem;">
            <a href="/settings" class="text-dark text-decoration-none py-2 px-2 rounded hover-subtle d-flex align-items-center gap-2">
                <i class="bi bi-gear" style="font-size: 1.15rem;"></i>
                <span>Pengaturan</span>
            </a>
            <a href="/user/logout" class="text-dark text-decoration-none py-2 px-2 rounded hover-subtle d-flex align-items-center gap-2">
                <i class="bi bi-box-arrow-right" style="font-size: 1.15rem;"></i>
                <span>Logout</span>
            </a>
        </div>
    </div>
</aside>
</body>
</html>
